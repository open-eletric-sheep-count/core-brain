<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How a dream runs — decision tree</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 32px; background: #fbfbfc; color: #1d2330;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 24px; font-weight: 650; }
  p.sub { margin: 0 0 28px; color: #5b6472; font-size: 14px; }
  svg { max-width: 100%; height: auto; display: block; }
  .node text { font-size: 15px; fill: #1d2330; }
  .side text { font-size: 14px; fill: #3b4351; }
  .label { font-size: 13px; fill: #5b6472; }
  .edge { stroke: #8a93a3; stroke-width: 1.6; fill: none; }
  .start rect { fill: #eef1f6; stroke: #6d7a8d; stroke-width: 1.5; }
  .action rect { fill: #e9f3ff; stroke: #3f7fb8; stroke-width: 1.5; }
  .decision polygon { fill: #fff5d8; stroke: #c3921f; stroke-width: 1.5; }
  .stop rect { fill: #f9eaea; stroke: #b4555a; stroke-width: 1.5; }
  .union rect { fill: #eaf6ec; stroke: #4b8b52; stroke-width: 1.5; }
  .synth rect { fill: #f1ecfb; stroke: #7b5fb0; stroke-width: 1.5; }
  .note rect { fill: #ffffff; stroke: #c8ced8; stroke-width: 1.3; stroke-dasharray: 5 4; }
  .legend text { font-size: 13px; fill: #3b4351; }
</style>
</head>
<body>
<h1>How a dream runs</h1>
<p class="sub">One pass straight down the spine. The dashed boxes on the right are what happens inside a step, not a detour: the pass always continues. The synthesis half also runs alone — it answers to the pair election, not to the episodes.</p>

<svg viewBox="0 0 1220 1800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision tree of the dream pass">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a3"/>
    </marker>
  </defs>

  <!-- ============ spine ============ -->

  <g class="node start">
    <rect x="170" y="90" width="500" height="60" rx="10"/>
    <text x="420" y="126" text-anchor="middle">A dream pass starts — scheduled, or the USER asks</text>
  </g>

  <g class="node decision">
    <polygon points="420,186 560,231 420,276 280,231"/>
    <text x="420" y="226" text-anchor="middle">dreams: true</text>
    <text x="420" y="246" text-anchor="middle">in the config?</text>
  </g>

  <g class="node action">
    <rect x="170" y="316" width="500" height="70" rx="10"/>
    <text x="420" y="346" text-anchor="middle">List the episodes without dreamedAt</text>
    <text x="420" y="368" text-anchor="middle">(oldest first, at most dreamEpisodesPerPass)</text>
  </g>

  <g class="node action">
    <rect x="170" y="426" width="500" height="80" rx="10"/>
    <text x="420" y="456" text-anchor="middle">Each episode tells what happened.</text>
    <text x="420" y="478" text-anchor="middle">A memory keeps only the part that stays true:</text>
    <text x="420" y="500" text-anchor="middle">a rule, a decision, a trap — not names or numbers.</text>
  </g>

  <g class="node decision">
    <polygon points="420,546 560,591 420,636 280,591"/>
    <text x="420" y="586" text-anchor="middle">daily limit reached</text>
    <text x="420" y="606" text-anchor="middle">(dreamPerDay)?</text>
  </g>

  <g class="node action">
    <rect x="170" y="676" width="500" height="60" rx="10"/>
    <text x="420" y="712" text-anchor="middle">Write the memories — one fact per memory</text>
  </g>

  <g class="node union">
    <rect x="170" y="776" width="500" height="80" rx="10"/>
    <text x="420" y="806" text-anchor="middle">Sweep the meaning: two memories at 0.97</text>
    <text x="420" y="828" text-anchor="middle">or above become one — the pass carries on</text>
  </g>

  <g class="node action">
    <rect x="170" y="896" width="500" height="70" rx="10"/>
    <text x="420" y="926" text-anchor="middle">Close the pass: every memory loses one point.</text>
    <text x="420" y="948" text-anchor="middle">At zero it is retired, and retired rows move to the history.</text>
  </g>

  <g class="node action">
    <rect x="170" y="1006" width="500" height="70" rx="10"/>
    <text x="420" y="1036" text-anchor="middle">Review the queue before the dream closes</text>
    <text x="420" y="1058" text-anchor="middle">(one row per pair the sweep joined)</text>
  </g>

  <g class="node synth decision">
    <polygon points="420,1116 580,1161 420,1206 260,1161"/>
    <text x="420" y="1156" text-anchor="middle">any pair in the</text>
    <text x="420" y="1176" text-anchor="middle">synthesis band?</text>
  </g>

  <g class="node synth">
    <rect x="170" y="1246" width="500" height="70" rx="10"/>
    <text x="420" y="1276" text-anchor="middle">ONE session writes the night:</text>
    <text x="420" y="1298" text-anchor="middle">it receives every group and has 30 minutes to answer.</text>
  </g>

  <g class="node synth decision">
    <polygon points="420,1356 580,1401 420,1446 260,1401"/>
    <text x="420" y="1396" text-anchor="middle">one block per group,</text>
    <text x="420" y="1416" text-anchor="middle">inside the ceiling?</text>
  </g>

  <g class="node union">
    <rect x="170" y="1486" width="500" height="84" rx="10"/>
    <text x="420" y="1514" text-anchor="middle">The union is written and the sources are retired.</text>
    <text x="420" y="1536" text-anchor="middle">The new memory is marked as a dream (real = 0).</text>
    <text x="420" y="1558" text-anchor="middle">Its score is the SUM of the sources.</text>
  </g>

  <g class="node start">
    <rect x="170" y="1596" width="500" height="60" rx="10"/>
    <text x="420" y="1622" text-anchor="middle">The 10 most recently used sessions receive it.</text>
    <text x="420" y="1644" text-anchor="middle">Top level only — a subagent never hears it.</text>
  </g>

  <!-- ============ side notes (inside a step, never a detour) ============ -->

  <g class="side note">
    <rect x="740" y="776" width="410" height="200" rx="10"/>
    <text x="760" y="806">Inside the sweep, per pair:</text>
    <text x="760" y="832">· no new sentence is written</text>
    <text x="760" y="854">· the richest text wins (the longest)</text>
    <text x="760" y="876">· the survivor keeps its id</text>
    <text x="760" y="898">· its score becomes the SUM of the pair</text>
    <text x="760" y="920">· the other is retired (absorbedInto)</text>
    <text x="760" y="942">· the pair is queued in dream_memories</text>
    <text x="760" y="964" class="label">the pass continues to the accounting either way</text>
  </g>

  <g class="side note">
    <rect x="740" y="1006" width="410" height="170" rx="10"/>
    <text x="760" y="1036">One verdict per row:</text>
    <text x="760" y="1062">· survivor says it all → settle it</text>
    <text x="760" y="1084">· absorbed adds a fact → one new</text>
    <text x="760" y="1106">  memory (≤ memoryMaxChars), retire the</text>
    <text x="760" y="1128">  survivor, settle with the new id</text>
    <text x="760" y="1150">· not the same thing → skipped</text>
  </g>

  <g class="side note">
    <rect x="740" y="1246" width="410" height="210" rx="10"/>
    <text x="760" y="1276">How the group is chosen:</text>
    <text x="760" y="1302">· band = synthesisMinCosine–0.97</text>
    <text x="760" y="1324">  (0.90 default · configurable)</text>
    <text x="760" y="1346">· every memory proposes its nearest</text>
    <text x="760" y="1368">  neighbour inside the band</text>
    <text x="760" y="1390">· ordered by cosine, the night takes</text>
    <text x="760" y="1412">  the highest — ONE group (ties random)</text>
    <text x="760" y="1434">· at least one side inside</text>
    <text x="760" y="1456">  synthesisWindowHours (48h)</text>
  </g>

  <g class="side note">
    <rect x="740" y="676" width="410" height="80" rx="10"/>
    <text x="760" y="706">Every write is capped at memoryMaxChars</text>
    <text x="760" y="728">(650 default): store, dream and dream-store</text>
    <text x="760" y="750">all refuse above it — the memory is never cut.</text>
  </g>

  <!-- ============ stops ============ -->

  <g class="node stop">
    <rect x="740" y="186" width="410" height="80" rx="10"/>
    <text x="760" y="218">Stop — nothing is listed</text>
    <text x="760" y="240">and nothing is written.</text>
  </g>

  <g class="node stop">
    <rect x="740" y="316" width="410" height="80" rx="10"/>
    <text x="760" y="348">Stop — nothing to dream:</text>
    <text x="760" y="370">the list is empty.</text>
  </g>

  <g class="node stop">
    <rect x="740" y="546" width="410" height="90" rx="10"/>
    <text x="760" y="578">Refused — a pause, not an error. A manual</text>
    <text x="760" y="600">run passes force: true; the scheduled</text>
    <text x="760" y="622">path never does.</text>
  </g>

  <g class="node stop">
    <rect x="740" y="1246" width="0" height="0" fill="none" stroke="none"/>
  </g>

  <g class="node stop">
    <rect x="740" y="1356" width="410" height="80" rx="10"/>
    <text x="760" y="1388">That group is ignored — no block, too long</text>
    <text x="760" y="1410">or refused: nothing is removed for it.</text>
  </g>

  <!-- the night can end before the synthesis -->
  <g class="node stop">
    <rect x="170" y="1220" width="0" height="0" fill="none" stroke="none"/>
  </g>

  <!-- ============ edges ============ -->

  <path class="edge" d="M420 150 L420 186" marker-end="url(#arrow)"/>
  <path class="edge" d="M560 231 L740 226" marker-end="url(#arrow)"/>
  <text x="650" y="218" class="label" text-anchor="middle">no</text>
  <path class="edge" d="M420 276 L420 316" marker-end="url(#arrow)"/>
  <text x="436" y="301" class="label">yes</text>
  <path class="edge" d="M670 351 L740 356" marker-end="url(#arrow)"/>
  <text x="705" y="342" class="label" text-anchor="middle">empty</text>
  <path class="edge" d="M420 386 L420 426" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 506 L420 546" marker-end="url(#arrow)"/>
  <path class="edge" d="M560 591 L740 591" marker-end="url(#arrow)"/>
  <text x="650" y="582" class="label" text-anchor="middle">yes, not forced</text>
  <path class="edge" d="M420 636 L420 676" marker-end="url(#arrow)"/>
  <text x="436" y="661" class="label">no</text>
  <path class="edge" d="M420 736 L420 776" marker-end="url(#arrow)"/>
  <path class="edge" d="M670 800 L740 806" marker-end="url(#arrow)"/>
  <text x="705" y="792" class="label" text-anchor="middle">a pair exists</text>
  <path class="edge" d="M420 856 L420 896" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 966 L420 1006" marker-end="url(#arrow)"/>
  <path class="edge" d="M670 1030 L740 1030" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 1076 L420 1116" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 1206 L420 1246" marker-end="url(#arrow)"/>
  <text x="436" y="1231" class="label">yes</text>
  <path class="edge" d="M580 1161 L700 1161 L700 1246" marker-end="url(#arrow)"/>
  <text x="620" y="1152" class="label" text-anchor="middle">no</text>
  <text x="712" y="1216" class="label">the night ends here</text>
  <path class="edge" d="M670 1280 L740 1290" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 1316 L420 1356" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 1446 L420 1486" marker-end="url(#arrow)"/>
  <text x="436" y="1471" class="label">yes</text>
  <path class="edge" d="M580 1401 L740 1396" marker-end="url(#arrow)"/>
  <text x="650" y="1388" class="label" text-anchor="middle">no</text>
  <path class="edge" d="M420 1570 L420 1596" marker-end="url(#arrow)"/>

  <!-- ============ legend ============ -->
  <g class="legend">
    <rect x="170" y="1690" width="14" height="14" rx="3" fill="#e9f3ff" stroke="#3f7fb8"/>
    <text x="194" y="1702">step</text>
    <rect x="270" y="1690" width="14" height="14" rx="3" fill="#fff5d8" stroke="#c3921f"/>
    <text x="294" y="1702">decision</text>
    <rect x="390" y="1690" width="14" height="14" rx="3" fill="#f9eaea" stroke="#b4555a"/>
    <text x="414" y="1702">stop</text>
    <rect x="480" y="1690" width="14" height="14" rx="3" fill="#eaf6ec" stroke="#4b8b52"/>
    <text x="504" y="1702">union at 0.97 or above</text>
    <rect x="680" y="1690" width="14" height="14" rx="3" fill="#f1ecfb" stroke="#7b5fb0"/>
    <text x="704" y="1702">synthesis band (config)</text>
    <rect x="900" y="1690" width="14" height="14" rx="3" fill="#ffffff" stroke="#c8ced8" stroke-dasharray="4 3"/>
    <text x="924" y="1702">inside a step</text>
  </g>
</svg>
</body>
</html>
